{% extends "base.html" %}
{% block content %}

<div class="header-bar">
  <h1 style="margin: 0;">📞 일자별 유선 현황</h1>
  <button type="button" onclick="location.href='/main'" class="main-btn">🏠 메인으로</button>
</div>

<form method="get" action="/daily-wire" class="search-form">
  <div class="search-row">
    <select name="search_column" class="dropdown-select">
        <option value="사번" {% if search_column == '사번' %}selected{% endif %}>사번</option>
        <option value="지사" {% if search_column == '지사' %}selected{% endif %}>지사</option>
        <option value="센터" {% if search_column == '센터' %}selected{% endif %}>센터</option>
        <option value="접점코드" {% if search_column == '접점코드' %}selected{% endif %}>접점코드</option>
    </select>
    <input type="text" name="search_value" class="search-input" placeholder="검색어 입력" value="{{ search_value or '' }}">
    <button type="submit" class="search-btn">🔍 검색</button>
    <button type="button" id="toggleBtn" class="toggle-btn" onclick="toggleHiddenColumns()">👁️ 사번/이름 보기</button>
  </div>

  <div class="radio-grid">
    <fieldset>
      <legend>📡 유선 전체</legend>
      <label><input type="radio" name="selected_sheet" value="신규+약갱" {% if selected_sheet == "신규+약갱" %}checked{% endif %}> 신규+약갱</label>
    </fieldset>
    <fieldset>
      <legend>📞 신규</legend>
      <label><input type="radio" name="selected_sheet" value="신규개통 I+T" {% if selected_sheet == "신규개통 I+T" or not selected_sheet %}checked{% endif %}> I+T</label>
      <label><input type="radio" name="selected_sheet" value="신규개통 I" {% if selected_sheet == "신규개통 I" %}checked{% endif %}> I</label>
      <label><input type="radio" name="selected_sheet" value="신규개통 T" {% if selected_sheet == "신규개통 T" %}checked{% endif %}> T</label>
    </fieldset>
    <fieldset>
      <legend>🔁 약갱</legend>
      <label><input type="radio" name="selected_sheet" value="약갱개통 I+T" {% if selected_sheet == "약갱개통 I+T" %}checked{% endif %}> I+T</label>
    </fieldset>
    <fieldset>
      <legend>📨 신규 접수</legend>
      <label><input type="radio" name="selected_sheet" value="신규접수 I+T" {% if selected_sheet == "신규접수 I+T" %}checked{% endif %}> I+T</label>
      <label><input type="radio" name="selected_sheet" value="신규접수 I" {% if selected_sheet == "신규접수 I" %}checked{% endif %}> I</label>
      <label><input type="radio" name="selected_sheet" value="신규접수 T" {% if selected_sheet == "신규접수 T" %}checked{% endif %}> T</label>
    </fieldset>
  </div>

  <input type="hidden" name="sort_column" value="합계">
  <input type="hidden" name="sort_order" value="desc">
</form>

<hr>

<div class="table-scroll-wrapper">
  {{ table_html | safe }}
</div>

<script>
function toggleHiddenColumns() {
    const allRows = document.querySelectorAll('.table tr');
    const headerCells = allRows[0]?.querySelectorAll('th') || [];

    let sabunIdx = -1, nameIdx = -1;

    // 헤더 텍스트 기준으로 사번/이름 컬럼 위치 찾기
    headerCells.forEach((cell, i) => {
        const text = cell.textContent.trim();
        if (text.includes('사번')) sabunIdx = i;
        if (text.includes('이름')) nameIdx = i;
    });

    const isCurrentlyHidden = headerCells[sabunIdx]?.classList.contains('hidden-col');

    // 모든 행에서 해당 인덱스의 셀에 hidden-col 토글
    allRows.forEach(row => {
        const cells = row.children;
        if (sabunIdx >= 0 && cells[sabunIdx]) {
            cells[sabunIdx].classList.toggle('hidden-col', !isCurrentlyHidden);
        }
        if (nameIdx >= 0 && cells[nameIdx]) {
            cells[nameIdx].classList.toggle('hidden-col', !isCurrentlyHidden);
        }
    });

    const btn = document.getElementById('toggleBtn');
    btn.innerText = isCurrentlyHidden ? '👁️ 사번/이름 숨기기' : '👁️ 사번/이름 보기';
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll('.sabun-col, .name-col').forEach(el => {
    el.classList.remove('hidden-col');
  });
});
</script>

<style>
.hidden-col {
  display: none !important;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.search-row {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  width: 100%;
}

.dropdown-select,
.search-input,
.search-btn,
.toggle-btn {
  flex: 1 1 25%;
  height: 48px;
  font-size: 18px;
  box-sizing: border-box;
  min-width: 0;
  padding-bottom: 8px;  /* ✅ 아래쪽만 */
}

.search-btn {
  background-color: #64b5f6;
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.toggle-btn {
  background-color: #e53935;
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding-bottom: 8px;  /* ✅ 아래쪽만 */
}

.toggle-btn:hover {
  background-color: #c62828;
}

.main-btn {
  background-color: #4CAF50;
  color: white;
  font-size: 16px;
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* ✅ radio-grid 고정 가로 배치 */
.radio-grid {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  justify-content: space-between;
  width: 100%;
}

.radio-grid fieldset {
  flex: 1 1 25%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background-color: #f9f9f9;
}

.radio-grid fieldset legend {
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 16px;
}

.radio-grid fieldset label {
  margin-bottom: 4px;
  font-size: 14px;
  white-space: nowrap;
}

.table th,
.table td {
  padding: 4px 10px;          /* ✅ 위아래 공간 줄임 */
  font-size: 18px;
  height: 32px;
  line-height: 1.2;
}
.table tr.sum-row td {
  background-color: #fff9c4 !important;  /* ✅ 연노랑 (Material 색상) */
  font-weight: bold;
  color: #000;
}
.radio-grid fieldset label input[type="radio"] {
  transform: scale(2);       /* ✅ 크기 2배 */
  margin-right: 10px;
}
.radio-grid fieldset label {
  font-size: 23px;   /* ✅ 텍스트 크기 */
  display: flex;
  align-items: center;
}

.radio-grid fieldset legend {
  font-size: 23px;       /* ✅ 그룹명 텍스트 크기 조절 */
  font-weight: bold;
  margin-bottom: 8px;
}
</style>

{% endblock %}
