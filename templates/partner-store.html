{% extends "base.html" %}

{% block content %}
{% set column_filter = column_filter if column_filter is not none else [] %}

<div class="header-bar">
  <h1 style="margin: 0;">🏪 파트너매장 현황</h1>
  <button type="button" onclick="location.href='/main'" class="main-btn">🏠 메인으로</button>
</div>

<form method="get" action="/partner-store" class="search-form">
    <div class="search-row">
        <label class="dropdown-wrapper">
            <select name="filter_column" class="dropdown-select"> 
                <option value="사번" {% if filter_column == "사번" %}selected{% endif %}>사번</option>
                <option value="지사" {% if filter_column == "지사" %}selected{% endif %}>지사</option>
                <option value="센터" {% if filter_column == "센터" %}selected{% endif %}>센터</option>
                <option value="접점코드" {% if filter_column == "접점코드" %}selected{% endif %}>접점코드</option>
            </select>
        </label>
        <input type="text" name="filter_value" class="search-input" placeholder="검색어 입력" value="{{ filter_value or '' }}">
        <button type="submit" class="search-btn">🔍 검색</button>
        <button type="button" id="toggleBtn" class="toggle-btn" onclick="toggleHiddenColumns()">👁️ 사번/이름 보기</button>
    </div>

    <fieldset style="margin-top:10px; display: flex; flex-wrap: wrap; gap: 20px; font-size: 23px;">
        <legend>✅ 정보 선택하기</legend>
        <label><input type="checkbox" name="column_filter" value="실적확인" onclick="handleCheckbox(this)" {% if "실적확인" in column_filter %}checked{% endif %}> 실적확인</label>
        <label><input type="checkbox" name="column_filter" value="파트너 정보" onclick="handleCheckbox(this)" {% if "파트너 정보" in column_filter %}checked{% endif %}> 파트너 정보</label>
        <label><input type="checkbox" name="column_filter" value="모두보기" onclick="handleCheckbox(this)" {% if "모두보기" in column_filter %}checked{% endif %}> 모두보기</label>
    </fieldset>
</form>

<hr>
<div class="table-wrapper" id="tableWrapper">
  <div style="position: relative;">
    {{ table_html|safe }}
  </div>
</div>

<script>
function handleCheckbox(clicked) {
    const 실적확인 = document.querySelector('input[name="column_filter"][value="실적확인"]');
    const 파트너정보 = document.querySelector('input[name="column_filter"][value="파트너 정보"]');
    const 모두보기 = document.querySelector('input[name="column_filter"][value="모두보기"]');

    if (clicked === 모두보기 && clicked.checked) {
        실적확인.checked = false;
        파트너정보.checked = false;
    } else if (clicked === 실적확인 && clicked.checked) {
        파트너정보.checked = false;
        모두보기.checked = false;
    } else if (clicked === 파트너정보 && clicked.checked) {
        실적확인.checked = false;
        모두보기.checked = false;
    }
}

function toggleHiddenColumns() {
    const sabuns = document.querySelectorAll('.sabun-col');
    const names = document.querySelectorAll('.name-col');
    const btn = document.getElementById('toggleBtn');

    const currentlyHidden = sabuns.length > 0 && sabuns[0].classList.contains('hidden-col');

    sabuns.forEach(el => el.classList.toggle('hidden-col'));
    names.forEach(el => el.classList.toggle('hidden-col'));

    btn.innerText = currentlyHidden ? '👁️ 사번/이름 숨기기' : '👁️ 사번/이름 보기';

    const wrapper = document.getElementById('tableWrapper');
    if (wrapper) wrapper.scrollLeft = 0;
}

// ✅ 사번/이름을 기본 보이도록 설정
window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.sabun-col, .name-col').forEach(el => {
    el.style.display = '';  // 기본 보임
  });
});
</script>

<style>
.hidden-col {
    display: none !important;
}
.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
}
.search-form {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
}
.search-row {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    width: 100%;
    gap: 8px;
}
.dropdown-select,
.search-input,
.search-btn,
.toggle-btn {
    flex: 1;
    height: 40px;
    font-size: 16px;
    padding: 4px 8px;
    box-sizing: border-box;
    min-width: 0;
}
.search-btn {
    background-color: #64b5f6;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.toggle-btn {
    background-color: #e53935;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.toggle-btn:hover {
    background-color: #c62828;
}
.main-btn {
    background-color: #4CAF50;
    color: white;
    font-size: 16px;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.table-wrapper table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
    margin-top: 12px;
}
.table-wrapper th,
.table-wrapper td {
    border: 1px solid #ccc;
    padding: 6px 10px;
    text-align: center;
}
.table-wrapper tr.sum-row td {
    background-color: #fffacc !important;
    font-weight: bold;
    color: #000;
}
@media (max-width: 768px) {
  .search-row {
    flex-wrap: wrap;
    gap: 10px;
  }
  .dropdown-select,
  .search-input,
  .search-btn,
  .toggle-btn {
    flex: 1 1 48%;
  }
  .main-btn {
    margin-top: 8px;
    width: 100%;
  }
}
</style>
{% endblock %}
