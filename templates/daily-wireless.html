{% extends "base.html" %}
{% block content %}

<div class="header-bar">
  <h1 style="margin: 0;">🗓️ 일자별 무선</h1>
  <button type="button" onclick="location.href='/main'" class="main-btn">🏠 메인으로</button>
</div>

<form method="get" action="/daily-wireless" class="search-form">
  <div class="search-row">
    <select name="search_field" class="dropdown-select">
        <option value="사번" {% if search_field == "사번" %}selected{% endif %}>사번</option>
        <option value="지사" {% if search_field == "지사" %}selected{% endif %}>지사</option>
        <option value="센터" {% if search_field == "센터" %}selected{% endif %}>센터</option>
        <option value="접점코드" {% if search_field == "접점코드" %}selected{% endif %}>접점코드</option>
    </select>
    <input type="text" name="search_value" class="search-input" placeholder="검색어 입력" value="{{ search_value or '' }}">
    <button type="submit" class="search-btn">🔍 검색</button>
    <button type="button" id="toggleBtn" class="toggle-btn" onclick="toggleHiddenColumns()">👁️ 사번/이름 보기</button>
  </div>

  <input type="hidden" name="sort_column" value="합계">
  <input type="hidden" name="sort_order" value="desc">
</form>

<hr>
<div class="table-scroll-wrapper">
  {{ table_html | safe }}
</div>

<script>
function toggleHiddenColumns() {
    const allRows = document.querySelectorAll('.table tr');
    const headerCells = allRows[0]?.querySelectorAll('th') || [];

    let sabunIdx = -1, nameIdx = -1;

    // 헤더 텍스트 기준으로 사번/이름 컬럼 위치 찾기
    headerCells.forEach((cell, i) => {
        const text = cell.textContent.trim();
        if (text.includes('사번')) sabunIdx = i;
        if (text.includes('이름')) nameIdx = i;
    });

    const isCurrentlyHidden = headerCells[sabunIdx]?.classList.contains('hidden-col');

    // 모든 행에서 해당 인덱스의 셀에 hidden-col 토글
    allRows.forEach(row => {
        const cells = row.children;
        if (sabunIdx >= 0 && cells[sabunIdx]) {
            cells[sabunIdx].classList.toggle('hidden-col', !isCurrentlyHidden);
        }
        if (nameIdx >= 0 && cells[nameIdx]) {
            cells[nameIdx].classList.toggle('hidden-col', !isCurrentlyHidden);
        }
    });

    const btn = document.getElementById('toggleBtn');
    btn.innerText = isCurrentlyHidden ? '👁️ 사번/이름 숨기기' : '👁️ 사번/이름 보기';
}

document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.sabun-col, .name-col').forEach(el => {
        el.classList.remove('hidden-col');
    });
});
</script>

<style>
/* ✅ 숨김 class */
.hidden-col {
    display: none !important;
}

/* ✅ 우측 상단 메인 버튼 */
.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

/* ✅ 검색 필드 4등분 */
.search-row {
    display: flex;
    width: 100%;
    gap: 8px;
}

.dropdown-select,
.search-input,
.search-btn,
.toggle-btn {
    flex: 1 1 24%;
    min-width: 0;
    height: 50px;
    font-size: 18px;
    box-sizing: border-box;
}

/* 기존 버튼 스타일 */
.main-btn {
    background-color: #4CAF50;
    color: white;
    font-size: 16px;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.toggle-btn {
    background-color: #e53935;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.toggle-btn:hover {
    background-color: #c62828;
}

.table tr.sum-row td {
    background-color: #fff9c4 !important;
    font-weight: bold !important;
    color: #000;
}

.table th,
.table td {
    padding: 2px 6px !important;  /* ✅ 세로 공간 축소 */
    height: 20px;                 /* ✅ 행 높이 고정 (선택사항) */
    line-height: 1.2;
    font-size: 18px;              /* 글자 크기도 줄이면 더 조밀하게 */
}
</style>
{% endblock %}
